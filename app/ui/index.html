<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SparkCart Studio</title>
<style>
:root{--bg:#12141a;--card:#1c2029;--line:#2b3140;--tx:#e8ebf2;--mu:#8d96aa;--ac:#ffb020;--ok:#35d07f;--bad:#ff5a5f}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--line:#dfe2ea;--tx:#1a1d26;--mu:#667086;--ac:#d98200;--ok:#12a35a;--bad:#d93036}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:6px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:16px;margin-right:12px}header b i{color:var(--ac);font-style:normal}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--card);color:var(--tx)}
main{padding:16px;max-width:980px;margin:0 auto;padding-bottom:180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:15px}h3{margin:0 0 6px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{background:var(--ac);color:#1a1100;border:0;border-radius:8px;padding:8px 14px;font:600 14px inherit;cursor:pointer}
button.b.g{background:var(--line);color:var(--tx)}button.b:disabled{opacity:.45;cursor:default}
.lights{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.l{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}.dot.ok{background:var(--ok)}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
label{display:flex;flex-direction:column;gap:3px;color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mu);font-weight:500;font-size:12px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}.tag.ok{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.tag.bad{background:color-mix(in srgb,var(--bad) 25%,transparent);color:var(--bad)}
#log{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);height:150px;overflow:auto;padding:8px 16px;font:12px/1.4 Consolas,monospace}
#log .j{margin-bottom:8px}#log .n{color:var(--ac);font-weight:700}#log .f{color:var(--bad)}
.mu{color:var(--mu)}textarea{width:100%;min-height:150px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px Consolas,monospace}
</style></head><body>
<header><b>Spark<i>Cart</i> Studio</b>
<nav id="nav"></nav></header>
<main id="main"></main>
<div id="log"><span class="mu">Activity will show here.</span></div>
<script>
const $=s=>document.querySelector(s), api=(p,b)=>fetch('/api/'+p,b?{method:'POST',body:JSON.stringify(b)}:{}).then(r=>r.json());
let tab='home',S={},B=[],C={},busy=false;
const tabs=[['home','Home'],['batches','Batches'],['clips','Clips'],['request','New batch'],['settings','Settings']];
$('#nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
const dot=ok=>`<span class="dot ${ok?'ok':''}"></span>`;
const post=async(p,b)=>{await api(p,b);poll()};
function draw(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const m=$('#main');
 if(tab=='home'){
  const L=[['Docker',S.docker],['Postiz',S.postiz],['ngrok tunnel',S.ngrok],['ffmpeg',S.ffmpeg],['yt-dlp',S.ytdlp],['Voice model',S.models],['Render engine',S.engine],['Postiz API key',S.api_key]];
  m.innerHTML=`<div class="card"><h2>One-button start</h2><p class="mu" style="margin:0 0 10px">Starts Docker Desktop, the Postiz containers and the ngrok tunnel, then waits until Postiz answers.</p>
  <div class="row"><button class="b" onclick="post('stack/start',{})">Start Docker + Postiz</button><button class="b g" onclick="post('stack/stop',{})">Stop Postiz</button><button class="b g" onclick="post('update',{})">Update scripts from GitHub</button></div></div>
  <div class="card"><h2>Status</h2><div class="lights">${L.map(l=>`<div class="l">${dot(l[1])}${l[0]}</div>`).join('')}</div></div>`;
 }
 if(tab=='batches'){
  m.innerHTML=B.length?B.map(b=>{
   const need=b.clips.filter(c=>!c.have).length, un=b.episodes.filter(e=>!e.rendered).length, sch=(b.state.scheduled||[]).length;
   return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Batch ${b.batch} <span class="mu">${b.note||''}</span></h2>
   <span class="tag ${sch?'ok':''}">${sch?`scheduled ${sch}`:'not scheduled'}</span></div>
   <table><tr><th>#</th><th>Video</th><th>Voice</th><th>Rendered</th></tr>${b.episodes.map(e=>`<tr><td>${e.num}</td><td>${e.title}</td><td>${e.voice||''}</td><td><span class="tag ${e.rendered?'ok':''}">${e.rendered?'yes':'no'}</span></td></tr>`).join('')}</table>
   <p class="mu">${b.clips.length?`Clips: ${b.clips.length-need}/${b.clips.length} ready`:'No clips needed'}</p>
   <div class="row">
    ${b.clips.length?`<button class="b" onclick="post('clips',{batch:${b.batch},render:true})">Get clips${un?' + render':''}</button>`:''}
    <button class="b" ${un?'':'disabled'} onclick="post('render',{batch:${b.batch}})">Render ${un} video(s)</button>
    <button class="b g" onclick="post('publish',{batch:${b.batch}})">Save to folders</button>
    <button class="b g" onclick="if(confirm('Delete this batch\\'s temporary clips?'))post('clean',{batch:${b.batch}})">Delete clips</button></div>
   <div class="row" style="margin-top:12px;align-items:end">
    <label>First post<input type="datetime-local" id="st${b.batch}" value="${nextStart()}"></label>
    <label>Gap min<input id="g1${b.batch}" type="number" style="width:70px" value="${C.gap_min}"></label>
    <label>Gap max<input id="g2${b.batch}" type="number" style="width:70px" value="${C.gap_max}"></label>
    <button class="b g" onclick="sched(${b.batch},true)">Preview times</button><button class="b" onclick="sched(${b.batch},false)">Schedule to Postiz</button></div></div>`}).join('')
   :`<div class="card">No batches yet. Ask Claude for a batch, then press <b>Update scripts from GitHub</b> on Home.</div>`;
 }
 if(tab=='clips'){
  m.innerHTML=`<div class="card"><h2>Download a clip</h2><p class="mu" style="margin:0 0 10px">Paste a video link, say where the clip starts and how long it is. It downloads just that part and cuts it.</p>
  <div class="row" style="align-items:end"><label style="flex:1;min-width:260px">Video link<input id="cl_url" style="width:100%"></label>
  <label>Name<input id="cl_name" placeholder="rb21-rivals" style="width:140px"></label>
  <label>Start (sec)<input id="cl_start" type="number" value="0" style="width:90px"></label>
  <label>Length (sec)<input id="cl_len" type="number" value="13" style="width:90px"></label>
  <button class="b" onclick="oneClip()">Download clip</button></div></div>
  <div class="card"><h2>Batch clips</h2><div class="row"><button class="b" onclick="post('clips/all',{})">Download all missing clips for every batch</button>
  <button class="b g" onclick="post('openclips',{})">Open clips folder</button></div>
  <p class="mu">Finished clips: ${(window.CL||[]).join(', ')||'none yet'}</p></div>`;
 }
 if(tab=='request'){
  m.innerHTML=`<div class="card"><h2>Ask Claude for a new batch</h2><p class="mu" style="margin:0 0 10px">Fill this in, copy it, paste it into the chat. Claude writes the scripts and clip list; you press Update and the batch appears.</p>
  <div class="row">${[['Roblox',4],['Geometry Dash',3],['Meme lore',2],['Trending',1]].map(x=>`<label>${x[0]}<input class="rq" data-k="${x[0]}" type="number" min="0" style="width:90px" value="${x[1]}"></label>`).join('')}
  <label>Length (sec)<input id="rlen" type="number" value="35" style="width:90px"></label>
  <label>Start<input id="rst" type="datetime-local" value="${nextStart()}"></label></div>
  <p><button class="b" onclick="mkReq()">Make request text</button></p><textarea id="rtxt" placeholder="Request text appears here"></textarea>
  <p><button class="b g" onclick="navigator.clipboard.writeText($('#rtxt').value)">Copy</button></p></div>`;
 }
 if(tab=='settings'){
  const f=[['timezone','Timezone'],['postiz_url','Postiz address (local)'],['compose_dir','Postiz docker folder'],['ngrok_cmd','ngrok command'],['docker_desktop','Docker Desktop (program or shortcut)'],['postiz_api_key','Postiz API key'],['youtube_id','YouTube channel ID'],['clips_dir','Clips folder'],['videos_dir','Finished videos folder'],['parallel','Videos rendered at once']];
  m.innerHTML=`<div class="card"><h2>Settings</h2><div style="display:grid;gap:10px">${f.map(x=>`<label>${x[1]}<input id="c_${x[0]}" value="${C[x[0]]??''}" ${x[0]=='postiz_api_key'?'type="password"':''}></label>`).join('')}</div>
  <p><button class="b" onclick="saveCfg()">Save</button></p><p class="mu">Postiz API key: open Postiz, Settings, Developers, Public API.</p></div>`;
 }
}
function oneClip(){const g=i=>$('#cl_'+i).value;if(!g('url')||!g('name'))return alert('Add a link and a name');post('clip',{url:g('url'),name:g('name'),start:+g('start'),len:+g('len')})}
function nextStart(){const d=new Date();d.setDate(d.getDate()+1);const [h,mi]=(C.start_time||'14:00').split(':');d.setHours(+h,+mi,0,0);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function sched(n,dry){const v=$('#st'+n).value.replace('T',' ');post('schedule',{batch:n,start:v,gap_min:+$('#g1'+n).value,gap_max:+$('#g2'+n).value,dry})}
async function saveCfg(){const o={};document.querySelectorAll('[id^=c_]').forEach(i=>{let v=i.value;o[i.id.slice(2)]=i.id=='c_parallel'?+v:v});await api('config',o);C=await api('config');alert('Saved')}
function mkReq(){const q=[...document.querySelectorAll('.rq')].filter(i=>+i.value).map(i=>`${i.value} ${i.dataset.k}`).join(', ');
 $('#rtxt').value=`Make a new batch: ${q}. Each video about ${$('#rlen').value} seconds. Schedule starting ${$('#rst').value.replace('T',' ')} (${C.timezone}). Same style and scripts as before, no repeats, no "Next:" teasers. Put it in batches/ so SparkCart Studio can pick it up.`}
async function poll(){
 S=await api('status');if(tab=='clips'){window.CL=await api('cliplist')}if(tab=='home')draw();
 const J=await api('jobs');
 $('#log').innerHTML=J.length?J.map(j=>`<div class="j"><span class="n">${j.name}</span> <span class="${j.status=='failed'?'f':'mu'}">${j.status} (${j.age}s)</span><br>${j.log.slice(-8).map(l=>l.replace(/</g,'&lt;')).join('<br>')}</div>`).join(''):'<span class="mu">Activity will show here.</span>';
 if(tab=='batches'){const nb=await api('batches');if(JSON.stringify(nb)!=JSON.stringify(B)){B=nb;if(!document.activeElement.matches('input'))draw()}}
}
(async()=>{C=await api('config');B=await api('batches');draw();poll();setInterval(poll,4000)})();
</script></body></html>
